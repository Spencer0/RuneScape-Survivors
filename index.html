<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gielinor Survivors</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<style>
    /* The whole game is one canvas: the client picks a logical resolution from the window
       (503px tall landscape / 480px wide portrait) and scales it to fill the screen. */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
    #canvas { display: block; position: fixed; left: 0; top: 0; image-rendering: pixelated; outline: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
</style>
</head>
<body>
<canvas id="canvas" width="765" height="503" tabindex="-1"></canvas>
<script type="module" src="client.js"></script>
</body>
</html>
